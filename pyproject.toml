[project]
name = "anonymizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docxtpl==0.20.1",
    "pyinstaller==6.16.0",
    "pydantic-settings==2.11.0",
    "pyperclip==1.11.0",
    "textract==1.6.5",
]

[dependency-groups]
dev = [
    "black==25.11.0",
    "mypy==1.18.2",
    "pre-commit>=4.4.0",
    "ruff==0.14.5",
    "setuptools==80.9.0",
    "types-pyperclip>=1.9.0.20250801",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    #    "F",
    #    # pyupgrade
    #    "UP",
    #    # flake8-bugbear
    #    "B",
    #    # flake8-simplify
    #    "SIM",
    # isort
    "I",
]

[[tool.mypy.overrides]]
module = ["textract.*"]
follow_untyped_imports = true
